[package]
name = "postern"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Auditable SSH gateway for MCP clients (early development)"
publish = false

[dependencies]
anyhow = "1"
axum = "0.8"
rmcp = { version = "=3.3.0", features = ["server", "macros", "schemars", "transport-streamable-http-server"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }

[dev-dependencies]
tempfile = "3"
